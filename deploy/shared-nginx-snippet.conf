# Эти два server-блока добавлены в общий nginx на сервере
# (/opt/artai/nginx.conf, контейнер artai-nginx), т.к. порт 80/443
# на сервере уже занят другим проектом (ARTAI). Файл лежит здесь
# только для справки/восстановления — сам он никуда не деплоится.
#
# При восстановлении добавлять ТОЛЬКО через append (>>), не через
# scp/перезапись файла целиком — иначе Docker потеряет bind-mount
# на существующий inode и потребуется `docker restart artai-nginx`.

server {
    listen 80;
    server_name belousov-alex.ru www.belousov-alex.ru;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name belousov-alex.ru www.belousov-alex.ru;

    ssl_certificate     /etc/letsencrypt/live/belousov-alex.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/belousov-alex.ru/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    location / {
        proxy_pass http://belousov-portfolio-web:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
